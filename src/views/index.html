<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App — PR #{{.PR}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fa; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: #24292f; }
    .badge { display: inline-block; background: #0969da; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
    .meta { margin-top: 6px; font-size: 13px; color: #57606a; }
    .meta code { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden; }
    .add-form { padding: 16px; border-bottom: 1px solid #d0d7de; display: flex; gap: 8px; }
    .add-form input { flex: 1; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none; }
    .add-form input:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }
    .add-form button { padding: 8px 16px; background: #2da44e; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .add-form button:hover { background: #2c974b; }
    .todo-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f6f8fa; gap: 10px; }
    .todo-item:last-child { border-bottom: none; }
    .todo-item input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: #2da44e; }
    .todo-title { flex: 1; font-size: 14px; color: #24292f; }
    .todo-title.done { text-decoration: line-through; color: #8c959f; }
    .delete-btn { background: none; border: 1px solid #d0d7de; border-radius: 6px; padding: 4px 10px; color: #cf222e; cursor: pointer; font-size: 13px; }
    .delete-btn:hover { background: #fff1f0; border-color: #cf222e; }
    .empty { padding: 32px; text-align: center; color: #8c959f; font-size: 14px; }
    .toggle-form, .delete-form { margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Todo App <span class="badge">PR #{{.PR}}</span></h1>
      <p class="meta">Branch: <code>{{.Branch}}</code> &nbsp;·&nbsp; Database: <code>{{.DB}}</code></p>
    </div>

    <div class="card">
      <form class="add-form" action="/todos" method="POST">
        <input type="text" name="title" placeholder="Add a new todo..." required autofocus>
        <button type="submit">Add</button>
      </form>

      {{if .Todos}}
        {{range .Todos}}
        <div class="todo-item">
          <form class="toggle-form" action="/todos/{{.ID}}/toggle" method="POST">
            <input type="checkbox" onchange="this.form.submit()" {{if .Done}}checked{{end}}>
          </form>
          <span class="todo-title {{if .Done}}done{{end}}">{{.Title}}</span>
          <form class="delete-form" action="/todos/{{.ID}}/delete" method="POST">
            <button class="delete-btn" type="submit">Remove</button>
          </form>
        </div>
        {{end}}
      {{else}}
        <div class="empty">No todos yet — add one above.</div>
      {{end}}
    </div>
  </div>
</body>
</html>
